# Construit l'installeur Windows (et macOS) gratuitement sur GitHub Actions.
# Déclenchement : push d'un tag v* (ex. v0.1.0) ou lancement manuel (onglet Actions).
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt pytest
      - run: cd backend && python -m pytest -q tests

  build:
    needs: test-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
            edition: scalp
            conf: src-tauri/tauri.release.conf.json
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
            edition: tech
            conf: src-tauri/tauri.tech.release.conf.json
          - os: macos-latest
            triple: aarch64-apple-darwin
            ext: ""
            edition: scalp
            conf: src-tauri/tauri.release.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Empaqueter le moteur d'analyse (PyInstaller)
        shell: bash
        run: |
          pip install -r backend/requirements.txt pyinstaller
          cd backend
          pyinstaller --onefile --noconsole --name analyst-backend \
            --collect-submodules uvicorn --collect-submodules keyring --collect-submodules websockets \
            --hidden-import win32ctypes.core run_backend.py
          mkdir -p ../app/src-tauri/binaries
          cp dist/analyst-backend${{ matrix.ext }} ../app/src-tauri/binaries/analyst-backend-${{ matrix.triple }}${{ matrix.ext }}

      - name: Construire l'application
        working-directory: app
        run: |
          npm ci
          npx tauri build --config ${{ matrix.conf }}

      - uses: actions/upload-artifact@v4
        with:
          name: installeur-${{ matrix.edition }}-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/dmg/*.dmg
